// ─── useLocalStorage 커스텀 훅 ────────────────────────────
const useLocalStorage = (key, defaultValue) => {
  const [value, setValue] = useState(() => {
    try {
      const stored = localStorage.getItem(key);
      return stored !== null ? JSON.parse(stored) : defaultValue;
    } catch {
      return defaultValue;
    }
  });

  useEffect(() => {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch {}
  }, [key, value]);

  return [value, setValue];
};

// ─── CREATE TAB ───────────────────────────────────────────
const CreateTab = ({ onShareToStore, selectedModelId, onOpenModelPicker, conversations, setConversations, currentConvId, setCurrentConvId, onAddToLibrary }) => {
  const currentModel = getModelById(selectedModelId);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [input, setInput] = useState("");
  const [isTyping, setIsTyping] = useState(false);
  const chatEndRef = useRef(null);
  const textareaRef = useRef(null);

  const messages = useMemo(() => {
    if (!currentConvId) return DEFAULT_MESSAGES;
    const conv = conversations.find(c => c.id === currentConvId);
    return conv ? conv.messages : DEFAULT_MESSAGES;
  }, [currentConvId, conversations]);

  useEffect(() => {
    chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages, isTyping]);

  const handleSend = useCallback(async () => {
    const text = input.trim();
    if (!text || isTyping) return;

    const userMsg = { id: Date.now(), role: "user", text };
    setInput("");
    setIsTyping(true);
    if (textareaRef.current) textareaRef.current.style.height = "auto";

    let convId = currentConvId;
    let currentMessages;

    if (!convId) {
      // 첫 메시지 → 새 대화 자동 생성
      const newId = Date.now();
      const newConv = {
        id: newId,
        title: text.slice(0, 20),
        messages: [...DEFAULT_MESSAGES, userMsg],
        createdAt: Date.now(),
      };
      setConversations(prev => [newConv, ...prev]);
      setCurrentConvId(newId);
      convId = newId;
      currentMessages = newConv.messages;
    } else {
      currentMessages = [...messages, userMsg];
      setConversations(prev => prev.map(c =>
        c.id === convId ? { ...c, messages: currentMessages } : c
      ));
    }

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: currentMessages.map(m => ({
            role: m.role === 'ai' ? 'assistant' : 'user',
            content: m.text
          }))
        })
      });
      const data = await res.json();
      setIsTyping(false);
      const aiMsg = {
        id: Date.now() + 1,
        role: "ai",
        text: data.content,
        hasPreview: !!data.appData,
        appTitle: data.appData?.appName,
        appIcon: data.appData?.appIcon,
      };
      setConversations(prev => prev.map(c =>
        c.id === convId ? { ...c, messages: [...c.messages, aiMsg] } : c
      ));
      // 앱 생성 시 Library에 자동 추가
      if (data.appData) {
        onAddToLibrary({
          id: Date.now() + 2,
          name: data.appData.appName,
          icon: data.appData.appIcon,
          color: "from-violet-400 to-purple-500",
          lastUsed: "방금 전",
          category: "AI",
        });
      }
    } catch (e) {
      setIsTyping(false);
      setConversations(prev => prev.map(c =>
        c.id === convId ? { ...c, messages: [...c.messages, {
          id: Date.now() + 1,
          role: "ai",
          text: "오류가 발생했어요. 잠시 후 다시 시도해주세요. 😥",
          hasPreview: false,
        }] } : c
      ));
    }
  }, [input, messages, isTyping, currentConvId, setConversations, setCurrentConvId, onAddToLibrary]);

  const handleKeyDown = (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); }
  };

  const handleTextareaChange = (e) => {
    setInput(e.target.value);
    e.target.style.height = "auto";
    e.target.style.height = Math.min(e.target.scrollHeight, 120) + "px";
  };

  const handleNewConv = () => {
    setCurrentConvId(null);
    setDrawerOpen(false);
    setInput("");
    if (textareaRef.current) textareaRef.current.style.height = "auto";
  };

  return (
    <div className="flex flex-col h-full relative">
      <ConversationDrawer
        isOpen={drawerOpen}
        onClose={() => setDrawerOpen(false)}
        conversations={conversations}
        currentConvId={currentConvId}
        onSelectConv={(id) => { setCurrentConvId(id); setDrawerOpen(false); }}
        onNewConv={handleNewConv}
      />

      <div className="px-5 pt-5 pb-3 flex-shrink-0">
        <div className="flex items-center justify-between gap-2">
          <div className="flex items-center gap-2.5 min-w-0">
            <button
              onClick={() => setDrawerOpen(true)}
              className="w-8 h-8 rounded-xl bg-white/8 border border-white/10 flex items-center justify-center text-white/60 hover:bg-white/12 active:scale-95 transition-all flex-shrink-0">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M3 6H21M3 12H21M3 18H21" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
              </svg>
            </button>
            <div className="min-w-0">
              <h1 className="text-white text-2xl font-bold">Create</h1>
              <p className="text-white/40 text-sm mt-0.5">AI와 함께 앱을 만들어보세요</p>
            </div>
          </div>
          <div className="flex items-center gap-2 flex-shrink-0">
            <button
              onClick={handleNewConv}
              className="flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-violet-600/20 border border-violet-500/30 text-violet-300 text-xs font-semibold hover:bg-violet-600/30 active:scale-95 transition-all">
              <Icon name="plus" size={12} />새 대화
            </button>
            <button onClick={onOpenModelPicker}
              className="flex items-center gap-2 px-3 py-2 rounded-2xl bg-white/8 border border-white/10 hover:bg-white/12 active:scale-95 transition-all">
              <div className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ background: currentModel.gradient }} />
              <span className="text-white/80 text-xs font-semibold">{currentModel.shortName}</span>
              <Icon name="chevron" size={13} className="text-white/40" />
            </button>
          </div>
        </div>
        {messages.length <= 1 && (
          <div className="flex gap-2 mt-4 overflow-x-auto pb-1 story-scroll">
            {CHAT_SUGGESTIONS.map((s, i) => (
              <button key={i} onClick={() => { setInput(s); textareaRef.current?.focus(); }}
                className="flex-shrink-0 px-3 py-1.5 rounded-full bg-white/10 border border-white/10 text-white/70 text-xs whitespace-nowrap">
                {s}
              </button>
            ))}
          </div>
        )}
      </div>

      <div className="flex-1 overflow-y-auto chat-scroll px-5 space-y-4 pb-2">
        {messages.map(msg => (
          <div key={msg.id} className={`flex fade-in ${msg.role === "user" ? "justify-end" : "items-end gap-2"}`}>
            {msg.role === "ai" && (
              <div className="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 text-xs font-bold text-white"
                style={{ background: currentModel.gradient }}>
                {currentModel.initial}
              </div>
            )}
            <div className="max-w-[78%]">
              <div className={`px-4 py-2.5 rounded-2xl text-sm leading-relaxed whitespace-pre-wrap
                ${msg.role === "user"
                  ? "bg-gradient-to-br from-violet-600 to-purple-700 text-white rounded-br-sm"
                  : "bg-white/10 text-white/90 rounded-bl-sm"}`}>
                {msg.text}
              </div>
              {msg.hasPreview && msg.role === "ai" && (
                <AppPreviewCard
                  title={msg.appTitle || "새 앱"}
                  icon={msg.appIcon || "✨"}
                  onShare={onShareToStore}
                />
              )}
            </div>
          </div>
        ))}
        {isTyping && <TypingIndicator />}
        <div ref={chatEndRef} />
      </div>

      <div className="flex-shrink-0 px-4 pb-4 pt-2">
        <div className="flex items-end gap-2 bg-white/8 border border-white/10 rounded-2xl px-3 py-2">
          <button className="text-white/40 hover:text-white/70 transition-colors p-1 flex-shrink-0 mb-0.5">
            <Icon name="attach" size={20} />
          </button>
          <textarea
            ref={textareaRef}
            value={input}
            onChange={handleTextareaChange}
            onKeyDown={handleKeyDown}
            placeholder="어떤 앱을 만들고 싶으신가요?"
            rows={1}
            className="flex-1 bg-transparent text-white placeholder-white/30 text-sm outline-none py-1 min-h-[28px]"
            style={{ height: "28px" }}
          />
          <button
            onClick={handleSend}
            disabled={!input.trim() || isTyping}
            className={`flex-shrink-0 w-8 h-8 rounded-xl flex items-center justify-center transition-all mb-0.5
              ${input.trim() && !isTyping
                ? "bg-gradient-to-br from-violet-600 to-purple-700 text-white shadow-lg shadow-violet-900/50"
                : "bg-white/10 text-white/30"}`}>
            <Icon name="send" size={14} />
          </button>
        </div>
      </div>
    </div>
  );
};

          <input value={search} onChange={e => setSearch(e.target.value)}
            placeholder="앱 이름이나 태그로 검색..."
            className="flex-1 bg-transparent text-white/80 placeholder-white/30 text-sm outline-none" />
        </div>
        <div className="flex gap-2 overflow-x-auto story-scroll">
          {tags.map(tag => (
            <button key={tag} onClick={() => setActiveTag(tag)}
              className={`flex-shrink-0 px-3.5 py-1.5 rounded-full text-xs font-medium transition-all
                ${activeTag === tag ? "bg-violet-600 text-white" : "bg-white/8 border border-white/10 text-white/60"}`}>
              {tag}
            </button>
          ))}
        </div>
      </div>

      <div className="flex gap-3 px-5 mb-3 overflow-x-auto story-scroll flex-shrink-0">
        {STORIES.map(story => (
          <div key={story.id} className="flex flex-col items-center gap-1.5 flex-shrink-0">
            <div className={`w-14 h-14 rounded-2xl bg-gradient-to-br ${story.color} flex items-center justify-center
              ${!story.isAdd ? "ring-2 ring-violet-500 ring-offset-2 ring-offset-[#0a0a0f]" : "border-2 border-dashed border-white/20"}`}>
              {story.isAdd ? <Icon name="plus" size={20} className="text-white/70" /> : <span className="text-white font-bold text-sm">{story.avatar}</span>}
            </div>
            <span className="text-white/50 text-[10px]">{story.user}</span>
          </div>
        ))}
      </div>

      <div className="flex-1 overflow-y-auto feed-scroll px-4 space-y-4 pb-2">
        {filtered.length === 0 ? (
          <div className="text-center py-16 text-white/30">
            <Icon name="search" size={40} className="mx-auto mb-3 opacity-30" />
            <p className="text-sm">검색 결과가 없어요</p>
          </div>
        ) : filtered.map(post => (
          <div key={post.id} className="bg-white/5 border border-white/8 rounded-3xl overflow-hidden card-hover fade-in">
            <div className="flex items-center gap-3 p-4 pb-3">
              <div className={`w-10 h-10 rounded-2xl bg-gradient-to-br ${post.avatarColor} flex items-center justify-center`}>
                <span className="text-white font-bold text-xs">{post.avatar}</span>
              </div>
              <div className="flex-1">
                <p className="text-white font-semibold text-sm">{post.user}</p>
                <p className="text-white/40 text-xs">{post.handle}</p>
              </div>
              <button className="text-white/40"><Icon name="more" size={20} /></button>
            </div>
            <div className="mx-4 rounded-2xl overflow-hidden" style={{ background: post.preview, aspectRatio: "16/9" }}>
              <div className="w-full h-full flex flex-col items-center justify-center gap-2">
                <span className="text-4xl">{post.appIcon}</span>
                <span className="text-white font-bold text-lg">{post.appName}</span>
                <div className="flex items-center gap-1 bg-white/20 rounded-full px-2 py-0.5">
                  <Icon name="star" size={10} className="text-yellow-300" />
                  <span className="text-white text-xs font-medium">{post.rating}</span>
                  <span className="text-white/60 text-xs">· {post.downloads} 다운로드</span>
                </div>
              </div>
            </div>
            <div className="flex items-center gap-1 px-4 pt-3 pb-1">
              <button onClick={() => toggleLike(post.id)} className="flex items-center gap-1.5 p-1.5 -ml-1.5 rounded-xl active:scale-90">
                <Icon name={post.liked ? "heartFill" : "heart"} size={22} className={post.liked ? "text-red-400" : "text-white/60"} />
                <span className="text-white/60 text-sm">{post.likes}</span>
              </button>
              <button className="flex items-center gap-1.5 p-1.5 rounded-xl">
                <Icon name="comment" size={20} className="text-white/60" />
                <span className="text-white/60 text-sm">{post.comments}</span>
              </button>
              <button className="p-1.5 rounded-xl"><Icon name="share" size={20} className="text-white/60" /></button>
              <button onClick={() => toggleSave(post.id)} className="p-1.5 rounded-xl ml-auto active:scale-90">
                <Icon name={post.saved ? "bookmarkFill" : "bookmark"} size={20} className={post.saved ? "text-violet-400" : "text-white/60"} />
              </button>
            </div>
            <div className="px-4 pb-4">
              <p className="text-white/80 text-sm leading-relaxed">{post.description}</p>
              <div className="flex gap-1.5 mt-2.5 flex-wrap">
                {post.tags.map(tag => (
                  <span key={tag} className="px-2 py-0.5 rounded-full bg-violet-500/20 text-violet-300 text-xs">#{tag}</span>
                ))}
              </div>
              <button className="w-full mt-3 py-2.5 rounded-xl bg-white/8 border border-white/10 text-white/70 text-sm font-medium flex items-center justify-center gap-2">
                <Icon name="download" size={16} />
                라이브러리에 추가
              </button>
            </div>
          </div>
        ))}
        <div className="h-2"></div>
      </div>
    </div>
  );
};

// ─── LIBRARY TAB ──────────────────────────────────────────
const LibraryTab = ({ apps, setApps }) => {
  const [search, setSearch] = useState("");

  const filtered = apps.filter(app =>
    app.name.toLowerCase().includes(search.toLowerCase()) || app.category.includes(search)
  );

  return (
    <div className="flex flex-col h-full">
      <div className="px-5 pt-5 pb-3 flex-shrink-0 space-y-3">
        <div className="flex items-center justify-between">
          <div>
            <h1 className="text-white text-2xl font-bold">Library</h1>
            <p className="text-white/40 text-sm mt-0.5">{apps.length}개의 앱이 있어요</p>
          </div>
          <button className="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-600 to-purple-700 flex items-center justify-center glow">
            <Icon name="plus" size={18} className="text-white" />
          </button>
        </div>
        <div className="flex items-center gap-2 bg-white/8 border border-white/10 rounded-xl px-3 py-2">
          <Icon name="search" size={16} className="text-white/40 flex-shrink-0" />
          <input value={search} onChange={e => setSearch(e.target.value)}
            placeholder="내 앱 검색..."
            className="flex-1 bg-transparent text-white/80 placeholder-white/30 text-sm outline-none" />
        </div>
      </div>

      <div className="flex-1 overflow-y-auto chat-scroll px-5 pb-4">
        {!search && (
          <div className="mb-6">
            <h2 className="text-white/60 text-xs font-semibold uppercase tracking-wider mb-3">최근 사용</h2>
            <div className="grid grid-cols-2 gap-3">
              {filtered.slice(0, 2).map(app => (
                <button key={app.id} className="bg-white/5 border border-white/8 rounded-2xl p-4 text-left card-hover fade-in">
                  <div className={`w-12 h-12 rounded-2xl bg-gradient-to-br ${app.color} flex items-center justify-center mb-3 text-xl`}>
                    {app.icon}
                  </div>
                  <p className="text-white font-semibold text-sm">{app.name}</p>
                  <p className="text-white/40 text-xs mt-0.5">{app.lastUsed}</p>
                </button>
              ))}
            </div>
          </div>
        )}
        <div>
          <h2 className="text-white/60 text-xs font-semibold uppercase tracking-wider mb-3">
            {search ? "검색 결과" : "모든 앱"}
          </h2>
          {filtered.length === 0 ? (
            <div className="text-center py-16 text-white/30">
              <Icon name="search" size={40} className="mx-auto mb-3 opacity-30" />
              <p className="text-sm">앱을 찾을 수 없어요</p>
            </div>
          ) : (
            <div className="space-y-2">
              {filtered.map(app => (
                <div key={app.id} className="flex items-center gap-3 p-3 rounded-2xl bg-white/5 border border-white/8 card-hover fade-in">
                  <div className={`w-12 h-12 rounded-2xl bg-gradient-to-br ${app.color} flex items-center justify-center text-xl flex-shrink-0`}>
                    {app.icon}
                  </div>
                  <div className="flex-1 min-w-0">
                    <p className="text-white font-semibold text-sm">{app.name}</p>
                    <div className="flex items-center gap-2 mt-0.5">
                      <span className="text-white/40 text-xs">{app.lastUsed}</span>
                      <span className="w-1 h-1 rounded-full bg-white/20"></span>
                      <span className="text-violet-400/70 text-xs">{app.category}</span>
                    </div>
                  </div>
                  <div className="flex gap-1 flex-shrink-0">
                    <button className="w-8 h-8 rounded-xl bg-violet-600/20 flex items-center justify-center">
                      <Icon name="play" size={12} className="text-violet-400 ml-0.5" />
                    </button>
                    <button className="w-8 h-8 rounded-xl bg-white/8 flex items-center justify-center">
                      <Icon name="more" size={14} className="text-white/40" />
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

// ─── 메인 앱 ──────────────────────────────────────────────
const App = () => {
  const [activeTab, setActiveTab] = useState("create");
  const [posts, setPosts] = useLocalStorage('appforge_posts', STORE_POSTS);
  const [libraryApps, setLibraryApps] = useLocalStorage('appforge_library', LIBRARY_APPS);
  const [conversations, setConversations] = useLocalStorage('appforge_conversations', []);
  const [currentConvId, setCurrentConvId] = useLocalStorage('appforge_current_conv', null);
  const [shareDraft, setShareDraft] = useState(null);
  const [toast, setToast] = useState(null);
  const [selectedModelId, setSelectedModelId] = useState("gpt-4o-mini");
  const [showModelPicker, setShowModelPicker] = useState(false);

  const handleShareToStore = useCallback((appData) => setShareDraft(appData), []);

  const handleAddToLibrary = useCallback((appItem) => {
    setLibraryApps(prev => {
      if (prev.find(a => a.name === appItem.name)) return prev;
      return [appItem, ...prev];
    });
  }, [setLibraryApps]);

  const handleConfirmShare = useCallback((data) => {
    const newPost = {
      id: Date.now(),
      user: "나", handle: "@me",
      avatar: "나", avatarColor: "from-violet-500 to-purple-600",
      appName: data.appName, appIcon: data.appIcon,
      appColor: "from-violet-400 to-purple-500",
      description: data.description, tags: data.tags,
      likes: 0, comments: 0, saved: false, liked: false,
      preview: data.preview, rating: 5.0, downloads: "0",
    };
    setPosts(prev => [newPost, ...prev]);
    // Store 공유 시 Library 추가
    handleAddToLibrary({
      id: Date.now() + 1,
      name: data.appName,
      icon: data.appIcon,
      color: "from-violet-400 to-purple-500",
      lastUsed: "방금 전",
      category: data.tags[0] || "AI",
    });
    setShareDraft(null);
    setToast("Store에 공유됐어요! 라이브러리에도 추가됐어요 ✨");
    setTimeout(() => setToast(null), 3000);
    setActiveTab("store");
  }, [handleAddToLibrary]);

  const tabs = [
    { id: "create",  label: "Create",  icon: "sparkles" },
    { id: "store",   label: "Store",   icon: "store" },
    { id: "library", label: "Library", icon: "library" },
  ];
  const tabIndex = tabs.findIndex(t => t.id === activeTab);

  return (
    <div className="flex items-center justify-center w-screen h-screen bg-[#050508]">
      <div className="relative w-full max-w-sm h-full max-h-[844px] bg-[#0a0a0f] flex flex-col overflow-hidden"
        style={{ boxShadow: "0 0 80px rgba(139,92,246,0.15)" }}>

        <div className="flex-shrink-0 h-11 flex items-center justify-between px-6 pt-1">
          <span className="text-white/50 text-xs font-medium">9:41</span>
          <div className="flex items-center gap-1.5">
            <div className="flex gap-0.5 items-end h-3">
              {[3,4,5,4].map((h,i) => <div key={i} className="w-0.5 rounded-full bg-white/50" style={{height:`${h*2}px`}}></div>)}
            </div>
            <svg width="15" height="11" viewBox="0 0 15 11" fill="none">
              <path d="M0 3.5C2.5 1 5.5 0 7.5 0C9.5 0 12.5 1 15 3.5L13 5.5C11 3.5 9 2.5 7.5 2.5C6 2.5 4 3.5 2 5.5L0 3.5Z" fill="rgba(255,255,255,0.5)"/>
              <path d="M3.5 7C5 5.5 6.2 4.5 7.5 4.5C8.8 4.5 10 5.5 11.5 7L9.5 9C8.5 8 8 7.5 7.5 7.5C7 7.5 6.5 8 5.5 9L3.5 7Z" fill="rgba(255,255,255,0.5)"/>
              <circle cx="7.5" cy="10" r="1" fill="rgba(255,255,255,0.5)"/>
            </svg>
            <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
              <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="rgba(255,255,255,0.35)" strokeWidth="1"/>
              <rect x="2" y="2" width="16" height="8" rx="2" fill="rgba(255,255,255,0.6)"/>
              <path d="M23 4V8C24.1 7.5 24.1 4.5 23 4Z" fill="rgba(255,255,255,0.4)"/>
            </svg>
          </div>
        </div>

        <div className="flex-1 overflow-hidden">
          {activeTab === "create" && (
            <CreateTab
              onShareToStore={handleShareToStore}
              selectedModelId={selectedModelId}
              onOpenModelPicker={() => setShowModelPicker(true)}
              conversations={conversations}
              setConversations={setConversations}
              currentConvId={currentConvId}
              setCurrentConvId={setCurrentConvId}
              onAddToLibrary={handleAddToLibrary}
            />
          )}
          {activeTab === "store"   && <StoreTab posts={posts} setPosts={setPosts} />}
          {activeTab === "library" && <LibraryTab apps={libraryApps} setApps={setLibraryApps} />}
        </div>

        {showModelPicker && (
          <ModelPickerModal selectedModelId={selectedModelId} onSelect={setSelectedModelId} onClose={() => setShowModelPicker(false)} />
        )}
        {shareDraft && (
          <ShareModal appData={shareDraft} onClose={() => setShareDraft(null)} onConfirm={handleConfirmShare} />
        )}
        {toast && <Toast message={toast} />}

        <div className="flex-shrink-0 bottom-nav bg-[#0a0a0f]/80 border-t border-white/8">
          <div className="relative px-4 pt-2 pb-1">
            <div className="absolute top-0 left-0 right-0 h-px">
              <div className="tab-indicator absolute h-0.5 bg-violet-500 rounded-full"
                style={{ width: "33.33%", transform: `translateX(${tabIndex * 100}%)` }}>
              </div>
            </div>
            <div className="flex">
              {tabs.map(tab => (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                  className={`flex-1 flex flex-col items-center gap-1 py-1.5 transition-all ${activeTab === tab.id ? "text-violet-400" : "text-white/30"}`}>
                  <Icon name={tab.icon} size={22} />
                  <span className={`text-[10px] font-medium transition-all ${activeTab === tab.id ? "opacity-100" : "opacity-50"}`}>
                    {tab.label}
                  </span>
                </button>
              ))}
            </div>
          </div>
          <div className="flex justify-center pb-2">
            <div className="w-32 h-1 rounded-full bg-white/20"></div>
          </div>
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
